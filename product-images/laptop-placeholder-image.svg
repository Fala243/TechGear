<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- TechGear placeholder: laptop (used when a laptop has no photo) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#16264a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="470" rx="240" ry="16" fill="#3b82f6" opacity="0.18"/>
  <g fill="none" stroke="#60a5fa" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="250" y="160" width="300" height="205" rx="14" stroke-width="8"/>
    <rect x="274" y="184" width="252" height="157" rx="6" stroke-width="3" opacity="0.55"/>
    <path d="M205 395 H595 L570 432 H230 Z" stroke-width="8"/>
    <path d="M365 395 H435" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
